<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thắp Sáng Quê Hương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --accent:#ffcc4d; --accent2:#7ad7ff; --text:#fff; --sub:#c9d2ff; --panel:rgba(16,22,64,.82); --border:rgba(255,204,77,.55); --t1:#fff; --t2:#ffcf4d; --t3:#ff9a1f; --font:system-ui; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  #stage { position:absolute; left:50%; top:50%; width:1080px; height:1920px; transform-origin:0 0; overflow:hidden; font-family:var(--font); color:var(--text); }
  #cv { position:absolute; inset:0; width:1080px; height:1920px; }
  .abs { position:absolute; }
  /* tiêu đề */
  #title { left:0; right:0; top:34px; text-align:center; font-weight:900; font-size:76px; letter-spacing:1px; line-height:1;
    background:linear-gradient(180deg,var(--t1),var(--t2) 55%,var(--t3)); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px var(--t2-a45)); white-space:nowrap; }
  #title.it { font-style:italic; }
  #subtitle { left:0; right:0; top:126px; text-align:center; font-weight:700; font-size:34px; color:var(--text); text-shadow:0 2px 6px rgba(0,0,0,.5); }
  #subtitle b { color:var(--accent2); }
  #progressRow { left:60px; right:60px; top:184px; height:44px; display:flex; align-items:center; gap:22px; }
  #bar { flex:0 0 260px; height:20px; border-radius:20px; background:rgba(255,255,255,.14); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  #barFill { height:100%; width:0; border-radius:20px; background:linear-gradient(90deg,var(--t3),var(--accent),#fff6c8); transition:width .8s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 14px var(--accent); }
  #progText { font-weight:800; font-size:27px; white-space:nowrap; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  #progText em { font-style:normal; color:var(--accent); font-size:36px; }
  /* thanh sự kiện đang diễn ra (đại chiến, đố vui, may mắn) */
  #eventBar { left:40px; right:40px; top:240px; height:72px; display:flex; gap:12px; }
  .chip { flex:1; border-radius:18px; background:var(--panel); border:2px solid var(--border); display:flex; align-items:center; gap:10px; padding:0 18px; font-weight:800; font-size:24px; white-space:nowrap; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .chip.new { animation:chipIn .5s cubic-bezier(.2,1.4,.4,1); }
  .chip.battle { flex:2.2; } .chip.quiz { flex:2.2; }
  .chip .ic { font-size:34px; }
  .chip .tm { margin-left:auto; color:var(--accent); font-variant-numeric:tabular-nums; }
  .chip.wave { flex:0 0 260px; }
  .mini { height:10px; border-radius:6px; background:rgba(255,255,255,.15); overflow:hidden; flex:1; }
  .mini i { display:block; height:100%; background:linear-gradient(90deg,#ff4d7a,#ffb3c8); transition:width .6s; }
  @keyframes chipIn { from { transform:translateY(-30px) scale(.8); opacity:0 } }
  /* cột phải */
  #side { right:24px; top:330px; width:356px; display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--panel); border:2px solid var(--border); border-radius:20px; padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(255,255,255,.03); backdrop-filter:blur(4px); }
  .ph { display:flex; align-items:center; justify-content:space-between; font-weight:900; font-size:23px; letter-spacing:.5px; text-transform:uppercase; padding-bottom:8px; margin-bottom:6px; border-bottom:2px solid var(--border); }
  .ph small { font-size:18px; color:var(--accent); text-transform:none; font-variant-numeric:tabular-nums; }
  #lastGift { text-align:center; min-height:178px; }
  #lastGift .av { width:92px; height:92px; margin:6px auto 4px; }
  #lastGift .nm { font-weight:800; font-size:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #lastGift .ds { font-size:19px; color:var(--sub); }
  #lastGift .ds b { color:var(--accent); font-size:26px; }
  #lastGift.pop { animation:pop .7s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform:scale(.85) } 40% { transform:scale(1.07) } 100% { transform:scale(1) } }
  .av { border-radius:50%; background:#556 center/cover no-repeat; border:3px solid var(--accent); display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; box-shadow:0 0 16px var(--accent-a60); flex:none; }
  .rows { position:relative; }
  .row { position:absolute; left:0; right:0; height:42px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:22px; transition:transform .6s cubic-bezier(.2,.9,.2,1), opacity .4s; border-bottom:1px solid rgba(255,255,255,.08); }
  .row .rk { width:28px; text-align:center; font-weight:900; color:var(--accent); }
  .row .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .vl { font-variant-numeric:tabular-nums; font-weight:900; }
  .row .tag { font-size:15px; padding:1px 6px; border-radius:8px; background:var(--accent); color:#000; font-weight:900; }
  .row.r0 .rk { font-size:26px; }
  .row .xu { font-size:14px; color:var(--sub); margin-left:2px; }
  #tiers .tr { display:flex; justify-content:space-between; font-size:19px; font-weight:700; padding:3px 2px; }
  #tiers .tr b { color:var(--accent); }
  #country { margin-top:8px; border-radius:14px; padding:8px 10px; text-align:center; background:linear-gradient(180deg,var(--accent-a30),transparent); border:2px solid var(--accent); }
  #country .c1 { font-size:17px; color:var(--sub); font-weight:700; }
  #country .c2 { font-size:22px; font-weight:900; letter-spacing:.5px; }
  #country .mini i { background:linear-gradient(90deg,var(--t3),var(--accent),#fff); }
  /* dưới cùng */
  #bottom { left:24px; right:24px; top:1730px; height:170px; display:flex; align-items:flex-end; gap:16px; }
  #honor { width:190px; font-weight:900; font-size:22px; line-height:1.15; color:var(--accent); text-transform:uppercase; padding-bottom:16px; }
  #honor small { display:block; font-size:15px; color:var(--sub); text-transform:none; font-weight:600; margin-top:4px; }
  #podium { display:flex; align-items:flex-end; gap:12px; }
  .pd { width:170px; text-align:center; position:relative; }
  .pd .av { width:66px; height:66px; margin:0 auto -14px; position:relative; z-index:2; font-size:26px; }
  .pd .bx { border-radius:14px 14px 6px 6px; padding:16px 6px 6px; font-weight:900; font-size:22px; color:#222; box-shadow:0 6px 16px rgba(0,0,0,.35); }
  .pd .nm { font-size:17px; font-weight:800; color:var(--text); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pd.p1 .bx { background:linear-gradient(180deg,#fff3b0,#ffc83d); height:52px; }
  .pd.p0 .bx { background:linear-gradient(180deg,#f1f4ff,#b8c2dc); height:40px; }
  .pd.p2 .bx { background:linear-gradient(180deg,#ffd8b0,#e0904a); height:32px; }
  #mcTag { margin-left:auto; font-size:18px; color:var(--sub); padding-bottom:10px; white-space:nowrap; }
  /* dòng chạy sự kiện */
  #feed { left:30px; top:330px; width:600px; height:300px; pointer-events:none; }
  .fi { position:absolute; left:0; bottom:0; display:flex; align-items:center; gap:10px; padding:6px 14px 6px 6px; border-radius:30px; background:var(--panel); border:1.5px solid var(--border); font-weight:700; font-size:22px; white-space:nowrap; max-width:370px; overflow:hidden; text-overflow:ellipsis; transition:transform .5s cubic-bezier(.2,.9,.2,1), opacity .5s; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .fi .av { width:38px; height:38px; border-width:2px; font-size:17px; }
  .fi > span { overflow:hidden; text-overflow:ellipsis; }
  .fi b { color:var(--accent); }
  .fi .pt { color:var(--accent2); font-weight:900; }
  /* chức vụ */
  .rank { display:inline-block; padding:0 8px; border-radius:10px; background:var(--accent-a30); color:var(--accent); font-weight:900; font-size:.85em; white-space:nowrap; }
  .ranks { display:grid; grid-template-columns:1fr; }
  .ranks div { display:flex; justify-content:space-between; font-size:16px; font-weight:700; padding:2px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .ranks b { color:var(--accent); font-variant-numeric:tabular-nums; }
  .offs { margin-top:6px; display:flex; flex-direction:column; gap:4px; }
  .offs div { display:flex; align-items:center; gap:8px; font-size:15px; line-height:1.15; }
  .offs .av { width:30px; height:30px; border-width:2px; font-size:14px; }
  .offs b { font-size:16px; }
  .panel.flip { animation:flip .6s ease; }
  @keyframes flip { 0% { transform:rotateX(0) } 50% { transform:rotateX(90deg) } 100% { transform:rotateX(0) } }
  /* khách vào phòng */
  #joins { left:30px; top:1662px; width:640px; height:58px; pointer-events:none; }
  .jn { position:absolute; left:0; top:0; display:flex; align-items:center; gap:10px; padding:5px 18px 5px 5px; border-radius:30px; background:linear-gradient(90deg,var(--accent-a40),var(--panel)); border:1.5px solid var(--border); font-weight:800; font-size:23px; white-space:nowrap; max-width:640px; box-shadow:0 4px 14px rgba(0,0,0,.35); animation:jnIn .45s cubic-bezier(.2,1.4,.4,1); }
  .jn .av { width:44px; height:44px; border-width:2px; font-size:19px; }
  .jn b { color:var(--accent); }
  .jn small { color:var(--sub); font-weight:700; font-size:19px; }
  .jn.out { animation:jnOut .35s forwards; }
  @keyframes jnIn { from { transform:translateX(-120px); opacity:0 } }
  @keyframes jnOut { to { transform:translateY(-20px); opacity:0 } }
  /* băng-rôn lớn giữa màn */
  #banner { left:60px; right:60px; top:640px; text-align:center; pointer-events:none; }
  .bn { display:inline-block; padding:26px 40px; border-radius:30px; background:var(--panel); border:3px solid var(--accent); box-shadow:0 0 60px var(--accent-a50), 0 20px 50px rgba(0,0,0,.5); animation:bnIn .7s cubic-bezier(.2,1.5,.4,1); max-width:880px; }
  .bn.out { animation:bnOut .5s forwards; }
  .bn .k { font-size:28px; font-weight:800; color:var(--accent2); letter-spacing:2px; text-transform:uppercase; }
  .bn .h { font-size:64px; font-weight:900; line-height:1.1; margin:8px 0; background:linear-gradient(180deg,var(--t1),var(--t2) 60%,var(--t3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bn .d { font-size:30px; font-weight:700; }
  .bn .d b { color:var(--accent); }
  .bn .avs { display:flex; justify-content:center; gap:14px; margin:10px 0; }
  .bn .avs .av { width:110px; height:110px; font-size:42px; }
  @keyframes bnIn { from { transform:scale(.3) rotate(-4deg); opacity:0 } }
  @keyframes bnOut { to { transform:scale(1.2); opacity:0 } }
  /* đại chiến */
  .vs { display:flex; align-items:center; gap:14px; width:100%; }
  .vs .sd { flex:1; font-size:23px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vs .tug { flex:1.2; height:18px; border-radius:10px; background:#3a6bff; overflow:hidden; position:relative; }
  .vs .tug i { position:absolute; left:0; top:0; bottom:0; background:#ff3d5a; transition:width .5s; }
  /* màn tặng quà */
  #giftShow { left:0; right:0; top:330px; display:flex; justify-content:center; pointer-events:none; z-index:14; }
  #giftShow .gcard { position:relative; text-align:center; padding:16px 34px 18px; border-radius:28px; background:var(--panel); border:3px solid var(--accent); box-shadow:0 0 40px var(--accent-a50), 0 14px 40px rgba(0,0,0,.5); animation:gIn .55s cubic-bezier(.2,1.6,.4,1); overflow:hidden; min-width:420px; }
  #giftShow.out .gcard { animation:gOut .4s forwards; }
  #giftShow .gk { font-size:22px; font-weight:900; letter-spacing:3px; text-transform:uppercase; color:var(--accent2); position:relative; }
  #giftShow .grow { display:flex; justify-content:center; align-items:center; gap:14px; margin:8px 0 4px; position:relative; }
  #giftShow .gimg { width:96px; height:96px; display:flex; align-items:center; justify-content:center; font-size:72px; animation:gBob 1s ease-in-out infinite; }
  #giftShow .gimg img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 16px var(--accent)); }
  #giftShow .grow .av { width:84px; height:84px; font-size:34px; }
  #giftShow .gnm { font-size:34px; font-weight:900; position:relative; max-width:640px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #giftShow .gtx { font-size:24px; font-weight:700; color:var(--sub); position:relative; }
  #giftShow .gtx b { color:var(--text); }
  #giftShow .gx { color:var(--accent); font-weight:900; font-size:1.4em; display:inline-block; animation:gPop .5s cubic-bezier(.2,2,.4,1); }
  #giftShow .gpt { margin-top:8px; font-size:34px; font-weight:900; color:var(--accent); position:relative; text-shadow:0 0 18px var(--accent-a60); }
  #giftShow .gpt.small { font-size:22px; }
  #giftShow.t1 .gcard { transform:scale(.78); min-width:380px; border-width:2px; }
  #giftShow.t1 .gimg { width:70px; height:70px; font-size:52px; }
  #giftShow.t2 .gcard { border-color:#ffd23d; }
  #giftShow.t3, #giftShow.t4 { top:560px; }
  #giftShow.t3 .gcard, #giftShow.t4 .gcard { padding:26px 46px 28px; border-width:4px; border-color:#ffd23d; box-shadow:0 0 90px rgba(255,210,61,.7), 0 20px 60px rgba(0,0,0,.6); }
  #giftShow.t3 .gimg, #giftShow.t4 .gimg { width:150px; height:150px; font-size:110px; }
  #giftShow.t3 .grow .av, #giftShow.t4 .grow .av { width:120px; height:120px; font-size:48px; }
  #giftShow.t3 .gnm, #giftShow.t4 .gnm { font-size:50px; background:linear-gradient(180deg,#fff7d0,#ffd23d 55%,#ff8a2a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #giftShow.t3 .gpt, #giftShow.t4 .gpt { font-size:48px; }
  #giftShow.t4 { top:1060px; }
  #giftShow .grays { position:absolute; left:50%; top:50%; width:1400px; height:1400px; margin:-700px 0 0 -700px; background:repeating-conic-gradient(rgba(255,210,61,.22) 0 10deg, transparent 10deg 20deg); animation:gspin 6s linear infinite; }
  @keyframes gIn { from { transform:scale(.2) translateY(-80px); opacity:0 } }
  @keyframes gOut { to { transform:scale(.6) translateY(-60px); opacity:0 } }
  @keyframes gBob { 50% { transform:translateY(-8px) rotate(-4deg) scale(1.06) } }
  @keyframes gPop { from { transform:scale(3); opacity:0 } }
  /* màn chúc mừng cả nước rực sáng */
  #grand { inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; z-index:15; padding-bottom:200px; }
  #grand .gstar { position:absolute; font-size:520px; line-height:1; color:#ffd23d; opacity:.18; animation:gspin 8s linear infinite, gpulse 1.2s ease-in-out infinite; text-shadow:0 0 80px #ff3b3b; }
  #grand .gw { display:inline-block; white-space:nowrap; }
  #grand .gh { position:relative; font-size:92px; font-weight:900; text-align:center; line-height:1.1; max-width:760px; filter:drop-shadow(0 6px 0 rgba(0,0,0,.4)) drop-shadow(0 0 30px rgba(255,60,60,.8)); }
  #grand .gh span { display:inline-block; background:linear-gradient(180deg,#fff7d0,#ffd23d 50%,#ff5a2a); -webkit-background-clip:text; background-clip:text; color:transparent; animation:gletter .7s cubic-bezier(.2,1.8,.4,1) both, gwave 1.6s ease-in-out .8s infinite; }
  #grand .gav .av { width:140px; height:140px; font-size:56px; margin:18px auto 0; border-width:5px; }
  #grand .gs { position:relative; margin-top:16px; font-size:36px; font-weight:800; text-align:center; text-shadow:0 3px 8px rgba(0,0,0,.7); padding:10px 30px; border-radius:40px; background:rgba(0,0,0,.35); }
  #grand .gs b { color:#ffd23d; }
  #grand.off { animation:goff .8s forwards; }
  @keyframes gletter { from { transform:translateY(-200px) scale(2); opacity:0 } }
  @keyframes gwave { 50% { transform:translateY(-12px) } }
  @keyframes gspin { to { transform:rotate(360deg) } }
  @keyframes gpulse { 50% { opacity:.3 } }
  @keyframes goff { to { opacity:0; transform:scale(1.15) } }
  /* tổng kết */
  #summary { inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); z-index:20; }
  #summary .card { width:900px; border-radius:36px; padding:40px; background:var(--panel); border:3px solid var(--accent); text-align:center; box-shadow:0 0 80px var(--accent-a40); animation:bnIn .8s cubic-bezier(.2,1.4,.4,1); }
  #summary h2 { margin:0; font-size:66px; font-weight:900; background:linear-gradient(180deg,var(--t1),var(--t2),var(--t3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #summary .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:26px 0; }
  #summary .st { border-radius:20px; padding:18px 6px; background:rgba(255,255,255,.07); }
  #summary .st b { display:block; font-size:50px; color:var(--accent); font-variant-numeric:tabular-nums; }
  #summary .st span { font-size:22px; color:var(--sub); font-weight:700; }
  #summary h3 { font-size:30px; margin:18px 0 10px; color:var(--accent2); }
  #summary .tops { display:flex; justify-content:center; gap:30px; }
  #summary .tops div { font-size:22px; font-weight:800; width:220px; }
  #summary .tops .av { width:96px; height:96px; margin:0 auto 8px; font-size:36px; }
  #tap { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); color:#fff; font:700 22px system-ui; cursor:pointer; z-index:50; text-align:center; }
  /* nhẹ: bỏ hiệu ứng nặng */
  .lite .panel { backdrop-filter:none; }
  .lite #title { filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="title" class="abs">THẮP SÁNG QUÊ HƯƠNG</div>
  <div id="subtitle" class="abs"></div>
  <div id="progressRow" class="abs"><div id="bar"><div id="barFill"></div></div><div id="progText"></div></div>
  <div id="eventBar" class="abs"></div>
  <div id="feed" class="abs"></div>
  <div id="side" class="abs">
    <div class="panel" id="lastGift"><div class="ph">Vừa tặng quà <span>🎁</span></div><div id="lgBody"></div></div>
    <div class="panel"><div class="ph">Đua thắp đèn <small id="roundTime"></small></div><div class="rows" id="raceRows" style="height:210px"></div></div>
    <div class="panel"><div class="ph">Quê nhận nhiều quà <span>🎁</span></div><div class="rows" id="giftRows" style="height:210px"></div></div>
    <div class="panel"><div class="ph">Bảng điểm thắp đèn</div><div id="tiers"></div>
      <div id="country"><div class="c1" id="cTxt"></div><div class="c2">🇻🇳 CẢ NƯỚC RỰC SÁNG</div><div class="mini" style="margin-top:6px"><i id="cFill" style="width:0"></i></div></div>
    </div>
  </div>
  <div id="joins" class="abs"></div>
  <div id="banner" class="abs"></div>
  <div id="bottom" class="abs">
    <div id="honor">Vinh danh người thắp đèn<small>tặng quà nhiều nhất đêm nay</small></div>
    <div id="podium"></div>
    <div id="mcTag">🎙 MC đọc bằng giọng AI</div>
  </div>
  <div id="giftShow" class="abs"></div>
  <div id="grand" class="abs"></div>
  <div id="summary" class="abs"></div>
</div>
<div id="tap">🔊 Bấm vào màn hình để bật nhạc và giọng MC</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/tts.js"></script>
<script src="/vnmap/provinces.js"></script>
<script src="/vnmap/shapes.js"></script>
<script src="/vnmap/themes.js"></script>
<script src="/vnmap/map.js"></script>
</body>
</html>
