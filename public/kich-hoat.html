<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kích hoạt bản quyền</title>
<style>
  :root { --bg: #0a0b10; --card: #14151d; --line: #262838; --text: #ece6da; --mute: #9a96a4; --acc: #ff9a3c; --ok: #5fd18b; --err: #ff6b5a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #2a1608 0%, var(--bg) 60%); color: var(--text); font: 16px/1.55 "Segoe UI", system-ui, sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 24px; } .sub { color: var(--mute); margin: 0 0 22px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0d0e14; color: var(--text); font: 600 17px ui-monospace, Consolas, monospace; letter-spacing: 1px; text-transform: uppercase; }
  input:focus { outline: 2px solid var(--acc); border-color: transparent; }
  button { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 10px; background: linear-gradient(90deg, #ff7a2a, #ffb347); color: #1a0d04; font: 700 16px inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 14px; min-height: 22px; } .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .info { margin-top: 18px; padding: 14px; border-radius: 10px; background: #0d0e14; border: 1px solid var(--line); font-size: 14px; color: var(--mute); }
  .info b { color: var(--text); } a { color: var(--acc); }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--mute); font-weight: 600; }
  .mc { display: flex; gap: 8px; align-items: center; margin: 8px 0 18px; }
  .mc code { flex: 1; padding: 12px; border-radius: 10px; background: #0d0e14; border: 1px dashed var(--acc); font: 800 20px ui-monospace, Consolas, monospace; letter-spacing: 2px; text-align: center; color: var(--text); }
  .mc button { width: auto; margin: 0; padding: 12px 14px; }
  input#key { font-size: 14px; letter-spacing: 0; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <h1>🔥 Ngọn Lửa Cuối Cùng</h1>
  <p class="sub" id="sub">Nhập key bản quyền để mở game. Mỗi key dùng được trên số máy đã mua.</p>
  <div id="form">
    <div id="mcBox" style="display:none"><label>Mã máy của bạn</label><div class="mc"><code id="mc"></code><button class="ghost" id="cp">Chép</button></div></div>
    <label for="key">Key bản quyền</label>
    <input id="key" placeholder="Dán key vào đây (NLCC-… hoặc NLOF-…)" autocomplete="off" spellcheck="false">
    <button id="go">Kích hoạt</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="info" id="info"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const back = new URLSearchParams(location.search).get('tu') || '/ma-dieu-khien.html';
function show(i) {
  const shop = i.shop ? `<a href="${i.shop}" target="_blank" rel="noopener">${i.shop.replace(/^https?:\/\//, '')}</a>` : 'trang bán hàng';
  if (i.licensed) {
    $('form').style.display = 'none';
    $('sub').textContent = i.dev ? 'Bản đang phát triển: không cần key.' : 'Máy này đã được kích hoạt.';
    $('info').innerHTML = i.dev ? `<a href="${back}">Mở game →</a>` :
      `Gói: <b>${i.plan || ''}</b> · Key: <b>${i.key || ''}</b><br>Mã máy: <b>${i.machineCode}</b><br><br><a href="${back}">Mở game →</a><br><br>
       ${i.mode === 'online' ? '<button class="ghost" id="off">Gỡ kích hoạt khỏi máy này (để chuyển sang máy khác)</button>' : 'Key theo máy: đổi máy mới thì gửi mã máy mới cho người bán.'}`;
    const off = $('off'); if (off) off.onclick = async () => { if (!confirm('Gỡ key khỏi máy này?')) return; await fetch('/api/license/deactivate', { method: 'POST' }); location.reload(); };
  } else {
    $('mcBox').style.display = ''; $('mc').textContent = i.machineCode;
    $('cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(i.machineCode); $('cp').textContent = 'Đã chép'; };
    const zalo = i.contact ? `<a href="${i.contact}" target="_blank" rel="noopener">Zalo người bán</a>` : 'người bán';
    $('sub').textContent = i.online ? 'Nhập key bản quyền để mở game.' : 'Gửi mã máy bên dưới cho người bán để nhận key, rồi dán key vào đây.';
    $('info').innerHTML = (i.offline ? `Chưa có key? Chép <b>mã máy</b> ở trên, gửi cho ${zalo}. Key nhận được chỉ chạy trên máy này, không cần mạng.` : '')
      + (i.online ? `${i.offline ? '<br><br>' : ''}Mua key tại ${shop}.` : '') + (i.error ? `<br><br><span style="color:var(--err)">${i.error}</span>` : '');
  }
}
fetch('/api/license').then(r => r.json()).then(show);
$('go').onclick = async () => {
  const key = $('key').value.trim(); if (!key) return;
  $('go').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'Đang kích hoạt…';
  try {
    const r = await fetch('/api/license/activate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Kích hoạt thất bại');
    $('msg').className = 'msg ok'; $('msg').textContent = 'Kích hoạt thành công! Đang mở game…';
    setTimeout(() => location.href = back, 1200);
  } catch (e) { $('msg').className = 'msg err'; $('msg').textContent = e.message; }
  $('go').disabled = false;
};
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
</script>
</body>
</html>
