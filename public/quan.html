<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quán LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --acc:#ffcc4d; --acc2:#7ad7ff; --text:#fff; --sub:#d8d2ff; --panel:rgba(20,14,40,.84); --border:rgba(255,204,77,.55); --accA:rgba(255,204,77,.35); --font:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  #stage { position:absolute; left:50%; top:50%; width:1080px; height:1920px; transform-origin:0 0; overflow:hidden; font-family:var(--font); color:var(--text); }
  #cv { position:absolute; inset:0; width:1080px; height:1920px; }
  .abs { position:absolute; }
  #sign { left:0; right:0; top:26px; text-align:center; }
  #sign .t { display:inline-block; font-weight:900; font-size:74px; line-height:1; padding:14px 34px 18px; border-radius:26px; border:4px solid var(--acc); color:#fff; text-shadow:0 0 10px var(--acc), 0 0 30px var(--acc), 0 4px 0 rgba(0,0,0,.5); box-shadow:0 0 30px var(--accA), inset 0 0 30px var(--accA); background:rgba(0,0,0,.35); animation:flick 6s infinite; }
  @keyframes flick { 0%,92%,100% { opacity:1 } 93% { opacity:.6 } 95% { opacity:1 } 96% { opacity:.75 } }
  #sub { left:0; right:0; top:160px; text-align:center; font-weight:800; font-size:30px; text-shadow:0 2px 6px rgba(0,0,0,.7); }
  #sub b { color:var(--acc); }
  #chips { left:30px; right:30px; top:210px; height:58px; display:flex; gap:10px; }
  .chip { flex:1; border-radius:16px; background:var(--panel); border:2px solid var(--border); display:flex; align-items:center; gap:8px; padding:0 14px; font-weight:800; font-size:21px; white-space:nowrap; overflow:hidden; }
  .chip .tm { margin-left:auto; color:var(--acc); font-variant-numeric:tabular-nums; }
  .chip.hot { border-color:#ff5a5a; background:linear-gradient(90deg,rgba(255,60,60,.45),var(--panel)); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 22px rgba(255,80,80,.8) } }
  .mini { height:10px; border-radius:6px; background:rgba(255,255,255,.15); overflow:hidden; flex:1; }
  .mini i { display:block; height:100%; background:linear-gradient(90deg,#ff4d7a,#ffb3c8); transition:width .6s; }
  /* bảng dưới */
  #bottom { left:20px; right:20px; top:1440px; height:460px; display:grid; grid-template-columns:1.05fr .95fr 1fr; gap:14px; }
  .panel { background:var(--panel); border:2px solid var(--border); border-radius:20px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.4); overflow:hidden; }
  .ph { font-weight:900; font-size:21px; letter-spacing:.5px; text-transform:uppercase; padding-bottom:6px; margin-bottom:6px; border-bottom:2px solid var(--border); display:flex; justify-content:space-between; }
  .menu div { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .menu .ic { font-size:24px; width:30px; text-align:center; }
  .menu .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .menu b { color:var(--acc); white-space:nowrap; }
  .menu small { color:var(--sub); font-size:14px; }
  .av { border-radius:50%; background:#556 center/cover no-repeat; border:3px solid var(--acc); display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; flex:none; }
  #last { text-align:center; }
  #last .av { width:96px; height:96px; margin:8px auto 4px; font-size:38px; }
  #last .nm { font-weight:900; font-size:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #last .it { font-size:44px; margin-top:4px; }
  #last .ds { font-size:19px; color:var(--sub); }
  #last .ds b { color:var(--acc); }
  #last.pop { animation:pop .7s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 40% { transform:scale(1.07) } }
  .rows div { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .rows .av { width:36px; height:36px; border-width:2px; font-size:15px; }
  .rows .rk { width:22px; color:var(--acc); font-weight:900; text-align:center; }
  .rows .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rows b { color:var(--acc); }
  /* dòng sự kiện */
  #feed { left:24px; top:290px; width:520px; height:300px; pointer-events:none; }
  .fi { position:absolute; left:0; bottom:0; display:flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; border-radius:30px; background:var(--panel); border:1.5px solid var(--border); font-weight:700; font-size:20px; white-space:nowrap; max-width:520px; overflow:hidden; text-overflow:ellipsis; transition:transform .45s cubic-bezier(.2,.9,.2,1), opacity .45s; }
  .fi .av { width:34px; height:34px; border-width:2px; font-size:15px; }
  .fi b { color:var(--acc); }
  .rank { display:inline-block; padding:0 7px; border-radius:9px; background:var(--accA); color:var(--acc); font-weight:900; font-size:.82em; }
  /* băng-rôn */
  #banner { left:50px; right:50px; top:640px; text-align:center; pointer-events:none; z-index:12; }
  .bn { display:inline-block; padding:24px 40px; border-radius:30px; background:var(--panel); border:3px solid var(--acc); box-shadow:0 0 60px var(--accA), 0 20px 50px rgba(0,0,0,.5); animation:bnIn .6s cubic-bezier(.2,1.5,.4,1); max-width:900px; }
  .bn.out { animation:bnOut .45s forwards; }
  .bn .k { font-size:26px; font-weight:800; color:var(--acc2); letter-spacing:2px; text-transform:uppercase; }
  .bn .h { font-size:66px; font-weight:900; line-height:1.1; margin:6px 0; color:#fff; text-shadow:0 0 18px var(--acc); }
  .bn .d { font-size:28px; font-weight:700; }
  .bn .d b { color:var(--acc); }
  .bn .avs { display:flex; justify-content:center; gap:12px; margin:8px 0; }
  .bn .avs .av { width:110px; height:110px; font-size:42px; }
  @keyframes bnIn { from { transform:scale(.3) rotate(-4deg); opacity:0 } }
  @keyframes bnOut { to { transform:scale(1.2); opacity:0 } }
  /* combo chữ to */
  #combo { left:0; right:0; top:560px; text-align:center; pointer-events:none; z-index:13; }
  #combo .c { display:inline-block; font-size:130px; font-weight:900; color:#fff; -webkit-text-stroke:5px rgba(0,0,0,.6); text-shadow:0 0 30px var(--acc), 0 0 60px var(--acc); animation:cIn .9s cubic-bezier(.2,1.8,.3,1); }
  #combo .s { font-size:38px; font-weight:900; color:var(--acc); text-shadow:0 3px 8px #000; }
  @keyframes cIn { 0% { transform:scale(3) rotate(-10deg); opacity:0 } 60% { transform:scale(.9) rotate(3deg); opacity:1 } }
  #tap { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); color:#fff; font:700 22px system-ui; cursor:pointer; z-index:50; text-align:center; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="sign" class="abs"><span class="t" id="signT">QUÁN</span></div>
  <div id="sub" class="abs"></div>
  <div id="chips" class="abs"></div>
  <div id="feed" class="abs"></div>
  <div id="bottom" class="abs">
    <div class="panel"><div class="ph">Thực đơn quà <span>🎁</span></div><div class="menu" id="menu"></div></div>
    <div class="panel" id="last"><div class="ph">Vừa gọi món <span>🔔</span></div><div id="lastB"></div></div>
    <div class="panel"><div class="ph">Đại gia đêm nay <span>💰</span></div><div class="rows" id="big"></div><div class="ph" style="margin-top:8px" id="cmdH">Vua dzô</div><div class="rows" id="cmdTop"></div></div>
  </div>
  <div id="combo" class="abs"></div>
  <div id="banner" class="abs"></div>
</div>
<div id="tap">🔊 Bấm vào màn hình để bật nhạc và giọng MC</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/tts.js"></script>
<script src="/quan/venue.js"></script>
</body>
</html>
