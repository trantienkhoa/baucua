const FL = new Map();

let AC = null, master = null, noiseBuf = null, padGain = null, ducked = false;

  if (b.cc) { const f = flag(b.cc); if (f.ok) { g.globalAlpha = e * .32; g.drawImage(f.cv, x, y - (w * .75 - h) / 2, w, w * .75); g.globalAlpha = e; } }
  const sh = g.createLinearGradient(x, 0, x + w, 0); sh.addColorStop(0, 'rgba(0,0,0,.65)'); sh.addColorStop(1, 'rgba(0,0,0,.15)'); g.fillStyle = sh; g.fillRect(x, y, w, h);
  g.restore();
  g.lineWidth = b.mega ? 7 : 4; g.strokeStyle = b.mega ? `hsl(${(t * 300) % 360},100%,65%)` : b.hot ? '#ff5fa2' : '#ffd76a'; rr(x, y, w, h, 26); g.stroke();
  let tx = x + 30; const cy = y + h / 2;
  if (b.cc) { const fw = b.mega ? 200 : 128, fh = fw * .75; drawFlag(b.cc, tx, cy - fh / 2, fw, fh, 10); tx += fw + 24; }
  else if (b.icon) { T(b.icon, tx + 50, cy + 30, 84, '#fff', 'center'); tx += 124; }
  if (b.user) { const r = b.mega ? 62 : 40; drawAvatar(b.user, tx + r, cy, r, '#ffd76a'); tx += r * 2 + 22; }
  const mw = x + w - 28 - tx, s1 = b.mega ? 56 : 42, s2 = b.mega ? 44 : 32;
  g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 8;
  T(b.title, tx, cy - 6, fit(b.title, mw, s1, 900), '#fff', 'left', 900);
  T(b.sub, tx, cy + s2 + 6, fit(b.sub, mw, s2, 800), '#ffd76a', 'left', 800);
  g.restore();
}

// ---------- lễ trao giải + nghỉ giữa vòng
function waveFlag(cc, x, y, w, h, t) {
  const f = flag(cc); if (!f.ok) return; const n = 44, sw = f.cv.width / n, dw = w / n;
  for (let i = 0; i < n; i++) {
    const ph = i * .32 - t * 4.2, off = Math.sin(ph) * h * .04 * (i / n + .25);
    g.drawImage(f.cv, i * sw, 0, sw, f.cv.height, x + i * dw, y + off, dw + 1, h);
    const s = Math.cos(ph) * .16; g.fillStyle = s > 0 ? `rgba(255,255,255,${s})` : `rgba(0,0,0,${-s})`; g.fillRect(x + i * dw, y + off, dw + 1, h);
  }
}
function drawBreak(t, left) {
  const r = S.result; g.fillStyle = 'rgba(2,5,18,.97)'; g.fillRect(0, 225, W, 1260);
  if (!r || !r.winner) {
    T('🌍', W / 2, 760, 150, '#fff', 'center'); T('NO NATION JOINED YET', W / 2, 880, 64, '#fff', 'center', 900);
    T('Type your COUNTRY to start the next round!', W / 2, 950, 36, '#ffd76a', 'center', 800);
  } else {
    const wn = r.winner, NAME = wn.name.toUpperCase();
    T(`🏆 ROUND ${r.round} CHAMPION 🏆`, W / 2, 300, 40, '#ffd76a', 'center', 900);
    g.save(); g.shadowColor = 'rgba(255,215,106,.55)'; g.shadowBlur = 60; waveFlag(wn.cc, 320, 340, 440, 330, t); g.restore();
    const gr = g.createLinearGradient(0, 700, 0, 790); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#ffd76a');
    T(NAME, W / 2, 790, fit(NAME, 980, 104, 900), gr, 'center', 900);
    const wl = `${fmt(wn.score)} ${UNIT} · ${wn.players} player${wn.players === 1 ? '' : 's'}${wn.era != null && S.cfg.eras ? ` · ${ERAS[wn.era].i} ${ERAS[wn.era].n}` : ''}`;
    T(wl, W / 2, 846, fit(wl, 980, 36), '#cfe0ff', 'center', 800);
    const line = r.streak > 1 ? `🔥 ${r.streak} WINS IN A ROW — WHO CAN STOP ${NAME}?` : r.dethroned ? `⚔️ ${NAME} DETHRONED ${r.dethroned.toUpperCase()}!` : '✨ A NEW CHAMPION RISES!';
    T(line, W / 2, 900, fit(line, 980, 34, 900), '#ff8f5c', 'center', 900);
    // người hùng
    const hl = `HEROES OF ${NAME}${r.lmTotal ? ` · 🏛️ ${r.lm}/${r.lmTotal} LANDMARKS` : ''}`;
    T(hl, W / 2, 962, fit(hl, 900, 26), '#8fb4ff', 'center', 800);
    if (r.sup) { const s = `💎 TOP SUPPORTER TODAY: ${r.sup.name} — ${fmt(r.sup.coins)} coins`; T(s, W / 2, 932, fit(s, 940, 24), '#7df0ff', 'center', 800); }
    r.mvps.forEach((m, i) => {
      const y = 982 + i * 66; rr(190, y, 700, 58, 29); g.fillStyle = i === 0 ? 'rgba(255,200,60,.22)' : 'rgba(255,255,255,.08)'; g.fill();
      T(['🥇', '🥈', '🥉'][i], 226, y + 42, 34, '#fff', 'center'); drawAvatar(m, 286, y + 29, 24, '#ffd76a');
      T(m.name, 324, y + 40, fit(m.name, 360, 30), '#fff', 'left', 800); T(`+${fmt(m.pts)} ${UNIT}`, 870, y + 40, 28, '#ffcf4d', 'right', 800);
    });
    // á quân
    r.podium.forEach((c, i) => {
      const x = 110 + i * 450; drawFlag(c.cc, x, 1184, 56, 42, 6);
      T(`${i + 2}${i ? 'rd' : 'nd'} · ${c.name}`, x + 68, 1206, fit(`${i + 2}nd · ${c.name}`, 250, 26), '#fff', 'left', 800); T(`${fmt(c.score)} ${UNIT}`, x + 68, 1230, 20, '#ffcf4d', 'left', 700);
    });
    // bảng vương miện
    if (r.crowns.length) {
      T('👑 ALL-TIME CROWNS', W / 2, 1268, 22, '#ffd76a', 'center', 800);
      const n = r.crowns.length, x0 = W / 2 - n * 78;
      r.crowns.forEach(([cc, k], i) => { drawFlag(cc, x0 + i * 156 + 10, 1280, 56, 42, 6); T('×' + k, x0 + i * 156 + 76, 1313, 28, '#fff', 'left', 900); });
    }
  }
  const s = Math.ceil(left), p = 1 + .03 * Math.sin(t * 6);
  g.save(); g.translate(W / 2, 1430); g.scale(p, p);
  rr(-480, -42, 960, 78, 39); const gr2 = g.createLinearGradient(-480, 0, 480, 0); gr2.addColorStop(0, '#1766ff'); gr2.addColorStop(1, '#18c6ff'); g.fillStyle = gr2; g.fill();
  T(`NEXT ROUND IN ${s}s — TYPE YOUR COUNTRY NOW!`, 0, 10, 36, '#fff', 'center', 900); g.restore();
}

// ---------- vòng lặp
let last = 0, audioTry = -9, heartAt = 0, fwAt = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000, dt = clamp(t - last || .016, .001, .05); last = t;
  if (!S) { g.fillStyle = '#02030c'; g.fillRect(0, 0, W, H); T('Connecting…', W / 2, 900, 40, '#9fc4ff', 'center'); return; }
  const left = Math.max(0, S.left - (performance.now() - sAt) / 1000), race = S.phase === 'race', fin = race && S.final;
  // âm thanh theo nhịp trận đấu
  if (!MUTE) {
    if (t - audioTry > 3) { audioTry = t; ac(); }
    if (master) master.gain.value = vol('sfx');
    if (fin && left > 0) { const gap = left <= 10 ? .42 : .8; if (t - heartAt > gap) { heartAt = t; sfx.heart(left <= 10); } }
    if (!race && S.result && S.result.winner && performance.now() - cheerAt < 9000 && t - fwAt > .55) { fwAt = t; firework(150 + Math.random() * 780, 300 + Math.random() * 420); }
  }
  let rush = 0; for (const n of nodes.values()) rush = Math.max(rush, n.heat - .25); rush = clamp(rush, 0, 1);
  g.save();
  if (shake > .5) { g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= Math.pow(.02, dt); }
  if (MAPVIEW) { drawMap(t, dt); if (race) { drawGoal(); drawConts(); } } else { drawBg(t, dt, rush); drawField(t, dt); }
  drawParts(dt);
  if (fin) { // viền đỏ nhấp nháy
    const v = g.createRadialGradient(W / 2, 860, 380, W / 2, 860, 1000); v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, `rgba(255,30,30,${.2 + .14 * Math.sin(t * 8)})`);
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    if (left <= 10 && left > 0) {
      const s = Math.ceil(left), fr = left % 1; g.globalAlpha = .25 + fr * .6; T(s, W / 2, 1120, 360 + fr * 80, '#fff', 'center', 900); g.globalAlpha = 1;
      if (s !== lastBeep) { lastBeep = s; sfx.beep(s <= 3); }
    }
  }
  drawHeader(t, left); drawCta(t); drawBoard(); drawLegend();
  if (race) { drawFeed(t); if (S.quiz) drawQuiz(t); else drawBanner(t, dt); } else { drawBreak(t, left); drawParts(0, true); drawFeed(t, 1338, 1); }
  if (!MUTE && t > 6 && (!AC || AC.state !== 'running')) { // trình duyệt thường chặn tiếng tới khi bấm chuột (OBS thì không)
    if (!OBS) { rr(300, 1490, 480, 44, 22); g.fillStyle = 'rgba(0,0,0,.7)'; g.fill(); T('🔊 Click once to turn sound on', W / 2, 1520, 22, '#ffd76a', 'center', 800); } // trong OBS không hiện nhắc này lên LIVE
  }
  if (flash > .02) { g.fillStyle = `rgba(255,255,255,${flash})`; g.fillRect(0, 0, W, H); flash *= Math.pow(.01, dt); }
  g.restore();
}
requestAnimationFrame(frame);
</script>
