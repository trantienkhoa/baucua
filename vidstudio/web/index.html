<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VieDub Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5a623'/%3E%3Cpath d='M9 10v12M13 7v18M17 11v10M21 8v16M25 13v6' stroke='%23181208' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <a class="logo" href="#/create" title="VieDub Studio">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 10v12M13 7v18M17 11v10M21 8v16M25 13v6" stroke="#181208" stroke-width="2.6" stroke-linecap="round"/></svg>
      </a>
      <div class="nav-items" id="nav"></div>
      <div class="nav-bottom">
        <button class="nav-item" id="btn-queue" title="Hàng đợi xử lý"><span class="ico" data-i="queue"></span><span>Hàng đợi</span><b class="badge" id="queue-badge" hidden>0</b></button>
        <button class="nav-item" id="btn-palette" title="Tìm lệnh (Ctrl+K)"><span class="ico" data-i="search"></span><span>Tìm lệnh</span></button>
      </div>
    </nav>
    <main id="view"></main>
  </div>

  <aside id="queue-panel" hidden>
    <header><b>Hàng đợi xử lý</b><button class="icon-btn" data-close>✕</button></header>
    <div id="queue-list"></div>
  </aside>

  <div id="palette" class="overlay" hidden>
    <div class="palette-box">
      <input id="palette-input" placeholder="Gõ lệnh hoặc tên video… (↑↓ để chọn, Enter để chạy)" autocomplete="off">
      <div id="palette-list"></div>
    </div>
  </div>

  <div id="modal" class="overlay" hidden><div class="modal-box" id="modal-box"></div></div>
  <div id="toasts"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
