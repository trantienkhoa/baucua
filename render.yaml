# Chạy game trên đám mây Render.com (dành cho người chỉ có điện thoại, nhất là iPhone).
# Render → New → Blueprint → chọn kho mã này. Xem README mục "Live bằng điện thoại".
services:
  - type: web
    name: hoa-si-neon
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: ADMIN_KEY          # mật khẩu trang điều khiển (Render tự tạo, xem ở tab Environment)
        generateValue: true
      - key: MODELS_URL         # link Google Drive gói nhân vật .zip (chế độ "Bất kỳ ai có đường liên kết")
        sync: false
      - key: TIKTOK_USERNAME    # tên kênh TikTok (không cần @)
        sync: false
