<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị — Ngọn Lửa Cuối Cùng</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
  .page { max-width: 1200px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: 600; }
  .st { padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .pending { background: rgba(255,179,71,.15); color: var(--a2); } .paid { background: rgba(95,209,139,.15); color: var(--ok); } .cancelled, .revoked { background: rgba(255,107,90,.15); color: var(--err); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .tabs { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
  .tabs .btn.on { border-color: var(--a1); color: var(--a2); }
  .scroll { overflow-x: auto; }
  input.s { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0b0b11; color: var(--text); }
</style>
</head>
<body>
<div class="page">
  <h1>🔥 Quản trị bán hàng</h1>
  <div id="login" class="box" style="margin-top:20px">
    <div class="field"><label for="pw">Mật khẩu quản trị</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn pri" style="margin-top:14px" onclick="login()">Đăng nhập</button><div class="err" id="lErr"></div>
  </div>
  <div id="main" style="display:none">
    <div class="tabs"><button class="btn sm on" data-t="orders">Đơn hàng</button><button class="btn sm" data-t="keys">Key</button><button class="btn sm" data-t="new">Tạo key tay</button>
      <span style="flex:1"></span><input class="s" id="q" placeholder="Tìm mã đơn, tên, SĐT, key…"></div>
    <div id="orders" class="scroll"></div>
    <div id="keys" class="scroll" style="display:none"></div>
    <div id="new" style="display:none" class="box">
      <p style="color:var(--mute)">Tạo key không qua đơn hàng (tặng, khách trả tiền mặt…).</p>
      <div class="field"><label for="nTier">Gói</label><select id="nTier"></select></div>
      <div class="field"><label for="nNote">Ghi chú (tên khách, SĐT)</label><input id="nNote"></div>
      <button class="btn pri" style="margin-top:14px" onclick="newKey()">Tạo key</button><div id="nOut" class="key mono" style="margin-top:12px"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const vnd = n => (n || 0).toLocaleString('vi-VN') + 'đ';
const dt = t => t ? new Date(t).toLocaleString('vi-VN') : '';
let PW = sessionStorage.getItem('pw') || '', D = null, tab = 'orders';
async function api(url, body) {
  const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: { 'x-admin': PW, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
async function login() { PW = $('pw').value; try { await refresh(); sessionStorage.setItem('pw', PW); } catch (e) { $('lErr').textContent = e.message; } }
async function refresh() { D = await api('/api/admin/data'); $('login').style.display = 'none'; $('main').style.display = ''; $('nTier').innerHTML = D.tiers.map(t => `<option value="${esc(t.id)}">${esc(t.name)} (${t.machines} máy)</option>`).join(''); render(); }
function match(o) { const q = $('q').value.trim().toLowerCase(); return !q || JSON.stringify(o).toLowerCase().includes(q); }
function render() {
  $('orders').innerHTML = `<table><tr><th>Mã đơn</th><th>Thời gian</th><th>Khách</th><th>Gói</th><th>Số tiền</th><th>Trạng thái</th><th>Key</th><th></th></tr>${D.orders.filter(match).map(o => `<tr>
    <td class="mono">${esc(o.id)}</td><td>${dt(o.createdAt)}</td><td>${esc(o.name)}<br><span style="color:var(--mute)">${esc(o.email || '')}${o.contact ? ' · ' + esc(o.contact) : ''}</span>${o.status === 'paid' ? `<br><small style="color:${o.mail && o.mail.ok ? '#5c5' : '#e66'}">${o.mail ? (o.mail.ok ? '✉ đã gửi mail' : '✉ lỗi: ' + esc(o.mail.error)) : '✉ chưa gửi'}</small> <button class="btn sm" onclick="act('/api/admin/order/${o.id}/mail','Gửi lại mail key + link tải cho ${esc(o.email || '')}?')">Gửi lại</button>` : ''}</td><td>${esc(o.planName)}</td><td>${vnd(o.amount)}</td>
    <td><span class="st ${o.status}">${o.status === 'paid' ? 'Đã trả' : o.status === 'pending' ? 'Chờ tiền' : 'Đã huỷ'}</span>${o.paidBy ? `<br><small style="color:var(--mute)">${esc(o.paidBy)}</small>` : ''}</td>
    <td class="mono">${esc(o.key || '')}</td>
    <td>${o.status === 'pending' ? `<button class="btn sm pri" onclick="act('/api/admin/order/${o.id}/paid','Xác nhận đã nhận ${vnd(o.amount)} cho đơn ${o.id}?')">Đã nhận tiền</button> <button class="btn sm" onclick="act('/api/admin/order/${o.id}/cancel','Huỷ đơn ${o.id}?')">Huỷ</button>` : ''}</td></tr>`).join('')}</table>`;
  $('keys').innerHTML = `<table><tr><th>Key</th><th>Gói</th><th>Máy</th><th>Ghi chú</th><th>Tạo lúc</th><th></th></tr>${D.keys.filter(match).map(k => `<tr>
    <td class="mono">${esc(k.key)}${k.revoked ? ' <span class="st revoked">Đã khoá</span>' : ''}</td><td>${esc(k.planName)}</td>
    <td>${k.devices.length}/${k.machines}${k.devices.map(d => `<br><small style="color:var(--mute)">${esc(d.name)} · ${dt(d.seen)}</small>`).join('')}</td>
    <td>${esc(k.note)}${k.order ? `<br><small class="mono">${esc(k.order)}</small>` : ''}</td><td>${dt(k.createdAt)}</td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="act('/api/admin/key/${k.key}/reset','Gỡ tất cả máy khỏi key này?')">Gỡ máy</button>
      <button class="btn sm" onclick="setM('${k.key}',${k.machines})">Số máy</button>
      ${k.revoked ? `<button class="btn sm" onclick="act('/api/admin/key/${k.key}/unrevoke')">Mở khoá</button>` : `<button class="btn sm" onclick="act('/api/admin/key/${k.key}/revoke','Khoá key này? Game của khách sẽ bị khoá ở lần kiểm tra sau.')">Khoá</button>`}</td></tr>`).join('')}</table>`;
}
async function act(url, ask) { if (ask && !confirm(ask)) return; try { await api(url, {}); await refresh(); } catch (e) { alert(e.message); } }
async function setM(k, n) { const v = prompt('Số máy cho key này:', n); if (!v) return; try { await api(`/api/admin/key/${k}/machines`, { machines: +v }); await refresh(); } catch (e) { alert(e.message); } }
async function newKey() { try { const r = await api('/api/admin/key', { tier: $('nTier').value, note: $('nNote').value }); $('nOut').textContent = r.key; await refresh(); } catch (e) { alert(e.message); } }
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); for (const t of ['orders', 'keys', 'new']) $(t).style.display = t === tab ? '' : 'none'; });
$('q').oninput = () => D && render();
$('pw').onkeydown = e => { if (e.key === 'Enter') login(); };
if (PW) refresh().catch(() => { PW = ''; });
setInterval(() => { if (D && document.visibilityState === 'visible') refresh().catch(() => {}); }, 15000);
</script>
</body>
</html>
